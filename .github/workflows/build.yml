# Builds the Reflex image, pushes it to ghcr.io/jhgaylor/reflex, then pins
# the immutable sha tag into k8s/deployment.yaml so Flux (home-cloud) rolls
# the exact image that was just built. Multi-arch because home-cloud's k3s
# nodes are arm64 Lima VMs. The SPA bundle is built on the runner (bun), so
# the docker stage is bun + server/ + dist/ and needs no QEMU-side compile.
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "README.md"

concurrency:
  group: build-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/reflex
  # The memory backend, built from source (engram publishes no release
  # artifacts). Bump deliberately; the P-256 patch in vendor/engram/ can be
  # dropped once that fix is merged upstream.
  ENGRAM_REF: cf63b530a5fb492041ebfc4900a8caabdcd01942

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # The store's tests are mostly SQL — an `on conflict` clause and a
    # `where user_id =` predicate — so they run against a real Postgres or
    # they do not run at all. Without TEST_DATABASE_URL they skip silently,
    # and the tests that skip are the ones guarding isolation between users.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: reflex
          POSTGRES_USER: reflex
          POSTGRES_DB: reflex_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Test and build
        env:
          TEST_DATABASE_URL: postgres://reflex:reflex@localhost:5432/reflex_test
        run: |
          bun install --frozen-lockfile
          bun test
          bun run build
      # engram is a private repo, so this checkout needs ENGRAM_REPO_TOKEN
      # (a fine-grained PAT with read access to engrambrain/engram) in the
      # repository secrets. Cross-compiled here on the runner — same reason
      # the SPA is: the docker stage stays QEMU-free.
      - name: Check out engram (memory backend)
        uses: actions/checkout@v7
        with:
          repository: engrambrain/engram
          ref: ${{ env.ENGRAM_REF }}
          token: ${{ secrets.ENGRAM_REPO_TOKEN }}
          path: .engram-src
      - uses: actions/setup-go@v6
        with:
          go-version-file: .engram-src/go.mod
          cache-dependency-path: .engram-src/go.sum
      - name: Build engram (linux amd64 + arm64, with the P-256 TLS patch)
        run: |
          cd .engram-src
          git apply ../vendor/engram/0001-tls-p256-fallback.patch
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-X main.version=${ENGRAM_REF::7}+p256" \
              -o ../vendor/engram/engram-linux-$arch ./cmd/engram
          done
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Pin image tag in k8s/deployment.yaml
        run: |
          sed -i -E "s#(image: ${IMAGE}:)sha-[0-9a-f]+#\1sha-${GITHUB_SHA}#" k8s/deployment.yaml
          git diff --quiet && { echo "already pinned"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "deploy: pin image sha-${GITHUB_SHA::7}"
          git push
