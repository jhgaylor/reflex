# Materializes Infisical `jhgaylor-playground` / prod / `/reflex` into the K8s
# Secret `reflex-env`. Holds REFLEX_SECRET, which seals every person's Fountain
# key at rest. Rotating it signs everyone out (they sign in again; nothing
# else is lost, since jobs and memory are not encrypted).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: reflex-env
  namespace: reflex
spec:
  hostAPI: http://infisical.infisical.svc.cluster.local:8080
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      # The shared `agent-apps-operator` identity (as Mend, Rounds and Ward use):
      # accepts the SA name `agent-app-secrets` in any namespace.
      identityId: 65877c19-830f-49dc-b524-45764ffc1e4b
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: agent-app-secrets
        namespace: reflex
      secretsScope:
        projectSlug: jhgaylor-playground-vgtp
        envSlug: prod
        secretsPath: "/reflex"
        recursive: false
  managedSecretReference:
    secretName: reflex-env
    secretNamespace: reflex
    creationPolicy: Orphan
